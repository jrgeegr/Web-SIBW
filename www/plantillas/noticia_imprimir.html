<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Imprimir - {{ noticia.titulo }}</title>
    <link rel="stylesheet" href="css/imprimir.css">
</head>
<body>
    <header class="cabecera">
        <div class="logo">
            <img src="{{ logo }}" alt="Logo Ayuntamiento">
        </div>
        <div class="nombre-sitio">
            <h1>Incidencias Don Benito</h1>
        </div>
    </header>

    <main class="zona-detalle-noticia">
        <header class="cabecera-noticia">
            <h1>{{ noticia.titulo }}</h1>
        </header>

        <section class="cuerpo-noticia">
            <div class="datos-tecnicos">
                <p><strong>Fecha:</strong> {{ noticia.fecha_pub }}</p>
                <p><strong>Tipo:</strong> {{ noticia.tipo }}</p>
                <p><strong>Lugar:</strong> {{ noticia.nombre_lugar }}</p>
                <p><strong>Responsable:</strong> {{ noticia.responsable }} ({{ noticia.concejalia }})</p>
            </div>
            <hr>
            <div class="texto-imprimir">
                {{ noticia.cuerpo }}
            </div>
        </section>

        <section class="galeria-noticia">
            {% for img in imagenes %}
                <figure class="foto">
                    <img src="{{ img.ruta_foto }}" alt="{{ img.titulo_foto }}">
                    <figcaption>{{ img.titulo_foto }}</figcaption>
                </figure>
            {% endfor %}
        </section>
    </main>

    <footer class="pie-pagina">
        <p class="copyright">&copy; 2026 Copyright</p>
    </footer>
    
    <script>window.print();</script>
</body>
</html>
